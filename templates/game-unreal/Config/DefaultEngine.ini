; Lot 0 test bed: the cheapest renderer that still draws, so -RenderOffScreen works on any GPU.
; Every line here is a candidate for the kit's own template; P1 confirms which ones the locked
; series actually honours.

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12

[/Script/Engine.RendererSettings]
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=0
r.Shadow.Virtual.Enable=0
r.DefaultFeature.AntiAliasing=2
r.SkinCache.CompileShaders=1
r.Nanite.ProjectEnabled=False

[/Script/Engine.Engine]
bSmoothFrameRate=False

[/Script/UnrealEd.EditorSettings]
bEnableEditorAnalytics=False

[Analytics]
bEnabled=False

[/Script/Engine.GameEngine]
bUseFixedFrameRate=True
FixedFrameRate=60.000000

[CrashReportClient]
bAgreeToCrashUpload=False
bImplicitSend=False

; The editor appends generated settings to this file the first time it opens the project, including
; a generated AndroidFileServer credential. This kit has no Android target, so it is disabled in
; the .uproject and nothing generated is ever committed here: the lot 0 bed is materialised from
; this template into an ignored working copy, and a test refuses any generated secret in the repo.
[/Script/AndroidFileServerEditor.AndroidFileServerRuntimeSettings]
bEnablePlugin=False
bAllowNetworkConnection=False
