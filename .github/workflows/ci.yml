name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    # Windows only, like the kit itself: nothing here is claimed to work elsewhere.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --python 3.13
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run fluidunreal schema check
      - name: Unit tests (no Unreal Engine)
        run: uv run pytest tests/unit -q
